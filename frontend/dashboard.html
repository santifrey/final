<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de control del sistema de gestión de ventas">
  <title>Dashboard - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom" id="main-navbar">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-graph-up-arrow"></i> Sales Manager
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              style="border-color: var(--border-color);">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="nav-auth" style="display: none;">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html"><i class="bi bi-box-seam me-1"></i>Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sales.html"><i class="bi bi-cart-check me-1"></i>Ventas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="users.html"><i class="bi bi-people me-1"></i>Usuarios</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3" id="nav-auth-right">
          <span class="text-secondary d-none d-lg-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nav-user-name"></span>
          </span>
          <button class="btn btn-logout btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
        <div id="nav-guest" style="display: none;">
          <a href="login.html" class="btn btn-primary-custom btn-sm">Iniciar Sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">
    <div class="container">
      <!-- Welcome Section -->
      <div class="welcome-section fade-in">
        <h2>Bienvenido, <span id="welcome-name" class="text-gradient">Usuario</span></h2>
        <p>Aquí tienes un resumen general de tu sistema de gestión de ventas.</p>
      </div>

      <!-- Stats Cards -->
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="stat-card stat-users fade-in">
            <div class="stat-icon">
              <i class="bi bi-people-fill"></i>
            </div>
            <div class="stat-value" id="stat-users">
              <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
            <div class="stat-label">Usuarios Registrados</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card stat-products fade-in">
            <div class="stat-icon">
              <i class="bi bi-box-seam-fill"></i>
            </div>
            <div class="stat-value" id="stat-products">
              <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
            <div class="stat-label">Productos Disponibles</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card stat-sales fade-in">
            <div class="stat-icon">
              <i class="bi bi-cart-check-fill"></i>
            </div>
            <div class="stat-value" id="stat-sales">
              <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
            <div class="stat-label">Ventas Realizadas</div>
          </div>
        </div>
      </div>

      <!-- Recent Sales -->
      <div class="card-custom fade-in">
        <div class="card-body p-0">
          <div class="p-3 pb-0">
            <h5 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2"></i>Ventas Recientes</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-custom mb-0">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Usuario</th>
                  <th>Productos</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="recent-sales-body">
                <tr>
                  <td colspan="4">
                    <div class="spinner-wrapper">
                      <div class="spinner-custom"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
