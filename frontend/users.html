<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de usuarios del sistema de ventas">
  <title>Usuarios - Gestion de Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom" id="main-navbar">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-graph-up-arrow"></i> Gestion de Ventas
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="nav-auth" style="display: none;">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html"><i class="bi bi-box-seam me-1"></i>Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sales.html"><i class="bi bi-cart-check me-1"></i>Ventas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="users.html"><i class="bi bi-people me-1"></i>Usuarios</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-secondary d-none d-lg-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nav-user-name"></span>
          </span>
          <button class="btn btn-logout btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title"><i class="bi bi-people me-2"></i>Gestión de Usuarios</h2>
        <button class="btn btn-primary-custom" onclick="openUserModal()">
          <i class="bi bi-plus-lg me-1"></i>Nuevo Usuario
        </button>
      </div>

      <div id="alert-container"></div>

      <div class="card-custom fade-in">
        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Fecha de Creación</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="users-body">
              <tr>
                <td colspan="4">
                  <div class="spinner-wrapper">
                    <div class="spinner-custom"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title" id="modal-title">Nuevo Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-body-custom">
          <form id="user-form">
            <input type="hidden" id="user-id">
            <div class="mb-3">
              <label for="name" class="form-label form-label-custom">Nombre</label>
              <input type="text" class="form-control form-control-custom" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label form-label-custom">Email</label>
              <input type="email" class="form-control form-control-custom" id="email" required>
            </div>
            <div class="mb-3" id="role-field-wrapper" style="display: none;">
              <label for="role" class="form-label form-label-custom">Rol</label>
              <select class="form-control form-control-custom" id="role">
                <option value="user">Usuario</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label form-label-custom">Contraseña (Opcional si editas)</label>
              <input type="password" class="form-control form-control-custom" id="password" minlength="6">
            </div>
          </form>
        </div>
        <div class="modal-footer modal-footer-custom">
          <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary-custom" id="btn-save-user">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content modal-content-custom">
        <div class="modal-body modal-body-custom text-center py-4">
          <i class="bi bi-exclamation-triangle text-warning display-4 mb-3"></i>
          <h5 class="mb-3">¿Eliminar usuario?</h5>
          <p class="text-secondary mb-4">Esta acción no se puede deshacer y puede fallar si tiene ventas asociadas.</p>
          <input type="hidden" id="delete-id">
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger-custom px-4" id="btn-confirm-delete">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
