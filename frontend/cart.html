<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom" id="main-navbar">
    <div class="container">
      <a class="navbar-brand" href="store.html">
        <i class="bi bi-shop"></i> Tienda
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="nav-auth" style="display: none;"></ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-secondary d-none d-lg-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nav-user-name"></span>
          </span>
          <button class="btn btn-logout btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title"><i class="bi bi-cart3 me-2"></i>Mi Carrito</h2>
      </div>

      <div id="alert-container"></div>

      <div class="row g-4 fade-in">
        <div class="col-lg-8">
          <div class="card-custom">
            <div class="table-responsive">
              <table class="table table-custom mb-0">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th style="width: 120px;">Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="cart-body">
                  <!-- Cart items loaded via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
        
        <div class="col-lg-4">
          <div class="card-custom position-sticky" style="top: 2rem;">
            <h4 class="mb-4 border-bottom border-secondary pb-3">Resumen de Compra</h4>
            
            <div class="d-flex justify-content-between mb-3">
              <span class="text-secondary">Subtotal</span>
              <span id="summary-subtotal" class="fw-bold">$0.00</span>
            </div>
            
            <div class="d-flex justify-content-between mb-4 border-bottom border-secondary pb-3">
              <span class="text-secondary">Envío</span>
              <span class="text-success">Gratis</span>
            </div>
            
            <div class="d-flex justify-content-between mb-4">
              <span class="fs-5">Total</span>
              <span id="summary-total" class="fs-4 fw-bold text-success">$0.00</span>
            </div>
            
            <button class="btn btn-primary-custom w-100 py-2 fs-5" id="btn-checkout" onclick="checkout()">
              <i class="bi bi-credit-card me-2"></i>Finalizar Compra
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
