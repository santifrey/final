<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en el sistema de gestión de ventas">
  <title>Iniciar Sesión - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">
        <i class="bi bi-graph-up-arrow"></i> Sales Manager
      </h1>
      <p class="auth-subtitle">Inicia sesión para acceder al sistema</p>

      <div id="alert-container"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label form-label-custom">Email</label>
          <input type="email" class="form-control form-control-custom" id="email"
                 placeholder="tu@email.com" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label form-label-custom">Contraseña</label>
          <input type="password" class="form-control form-control-custom" id="password"
                 placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="btn-login">
          <span class="btn-text">Iniciar Sesión</span>
          <span class="spinner-border spinner-border-sm d-none" id="btn-spinner" role="status"></span>
        </button>
      </form>

      <p class="text-center mb-0" style="color: var(--text-secondary); font-size: 0.9rem;">
        ¿No tienes cuenta?
        <a href="register.html" class="fw-600">Regístrate aquí</a>
      </p>
      <p class="text-center mb-0" style="color: var(--text-secondary); font-size: 0.9rem;">
        para accesos admin (accesos adicionales) utilizar:
        Usuario: admin@test.com
        Contraseña: password123
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
