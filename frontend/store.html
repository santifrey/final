<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom" id="main-navbar">
    <div class="container">
      <a class="navbar-brand" href="store.html">
        <i class="bi bi-shop"></i> Tienda
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="nav-auth" style="display: none;"></ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-secondary d-none d-lg-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nav-user-name"></span>
          </span>
          <button class="btn btn-logout btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="container">
      <div class="page-header text-center d-block mb-5">
        <h2 class="display-6 fw-bold mb-2">Nuestros Productos</h2>
        <p class="text-secondary">Encuentra la mejor selección al mejor precio</p>
      </div>

      <div id="alert-container"></div>

      <div class="row g-4" id="products-grid">
        <!-- Products will be loaded here -->
        <div class="col-12 text-center py-5">
          <div class="spinner-custom"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
