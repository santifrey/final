<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de ventas del sistema">
  <title>Ventas - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom" id="main-navbar">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-graph-up-arrow"></i> Sales Manager
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="nav-auth" style="display: none;">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html"><i class="bi bi-box-seam me-1"></i>Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sales.html"><i class="bi bi-cart-check me-1"></i>Ventas</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-secondary d-none d-lg-inline">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nav-user-name"></span>
          </span>
          <button class="btn btn-logout btn-sm" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title"><i class="bi bi-cart-check me-2"></i>Gestión de Ventas</h2>
        <button class="btn btn-primary-custom" onclick="openSaleModal()">
          <i class="bi bi-plus-lg me-1"></i>Registrar Venta
        </button>
      </div>

      <div id="alert-container"></div>

      <div class="card-custom fade-in">
        <div class="table-responsive">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Producto</th>
                <th>Precio Unit.</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="sales-body">
              <tr>
                <td colspan="7">
                  <div class="spinner-wrapper">
                    <div class="spinner-custom"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Sale Modal -->
  <div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title" id="modal-title">Registrar Venta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-body-custom">
          <form id="sale-form">
            <input type="hidden" id="sale-id">
            
            <div class="mb-3">
              <label for="user" class="form-label form-label-custom">Usuario</label>
              <select class="form-select form-select-custom" id="user" required>
                <option value="" disabled selected>Seleccione un usuario...</option>
                <!-- Loaded via JS -->
              </select>
            </div>
            
            <div class="mb-3">
              <label for="product" class="form-label form-label-custom">Producto</label>
              <select class="form-select form-select-custom" id="product" required onchange="updatePricePreview()">
                <option value="" disabled selected>Seleccione un producto...</option>
                <!-- Loaded via JS -->
              </select>
              <div id="product-price-preview" class="form-text text-secondary mt-1 small" style="display: none;">
                Precio unitario: <span id="preview-price-value" class="fw-bold text-success"></span>
              </div>
            </div>
            
            <div class="mb-4">
              <label for="quantity" class="form-label form-label-custom">Cantidad</label>
              <input type="number" class="form-control form-control-custom" id="quantity" min="1" value="1" required oninput="updateTotalPreview()">
            </div>
            
            <div class="p-3 bg-dark rounded border border-secondary mb-2 d-flex justify-content-between align-items-center">
              <span class="text-secondary fw-500">Total Estimado:</span>
              <span class="fs-5 fw-bold text-success" id="total-preview">$0.00</span>
            </div>
            
          </form>
        </div>
        <div class="modal-footer modal-footer-custom">
          <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary-custom" id="btn-save-sale">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content modal-content-custom">
        <div class="modal-body modal-body-custom text-center py-4">
          <i class="bi bi-exclamation-triangle text-warning display-4 mb-3"></i>
          <h5 class="mb-3">¿Eliminar venta?</h5>
          <p class="text-secondary mb-4">Esta acción no se puede deshacer.</p>
          <input type="hidden" id="delete-id">
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger-custom px-4" id="btn-confirm-delete">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
