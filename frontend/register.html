<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crear una cuenta en el sistema de gestión de ventas">
  <title>Registro - Sales Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">
        <i class="bi bi-person-plus-fill"></i> Crear Cuenta
      </h1>
      <p class="auth-subtitle">Regístrate para comenzar a usar el sistema</p>

      <div id="alert-container"></div>

      <form id="register-form" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label form-label-custom">Nombre</label>
          <input type="text" class="form-control form-control-custom" id="name"
                 placeholder="Tu nombre completo" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label form-label-custom">Email</label>
          <input type="email" class="form-control form-control-custom" id="email"
                 placeholder="tu@email.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label form-label-custom">Contraseña</label>
          <input type="password" class="form-control form-control-custom" id="password"
                 placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="mb-4">
          <label for="confirm-password" class="form-label form-label-custom">Confirmar Contraseña</label>
          <input type="password" class="form-control form-control-custom" id="confirm-password"
                 placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3" id="btn-register">
          <span class="btn-text">Crear Cuenta</span>
          <span class="spinner-border spinner-border-sm d-none" id="btn-spinner" role="status"></span>
        </button>
      </form>

      <p class="text-center mb-0" style="color: var(--text-secondary); font-size: 0.9rem;">
        ¿Ya tienes cuenta?
        <a href="login.html" class="fw-600">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
